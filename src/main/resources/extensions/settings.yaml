apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-right-menu-settings
spec:
  forms:
    - group: general
      label: 基本设置
      value:
        enabled: true
        includePaths: []
        excludePaths:
          - /console/**
          - /uc/**
          - /apis/**
        pjaxCompatible: true
        showNativeOnEditable: true
        style:
          theme: auto
          primaryColor: "#111827"
          menuWidth: 220
          borderRadius: 8
        menuItems:
          - id: copy-page-link
            label: 复制链接
            action: copyPageLink
            icon: ri:link
            context: common
            target: _self
            enabled: true
            order: 10
          - id: copy-page-title-link
            label: 复制标题和链接
            action: copyPageTitleLink
            icon: ri:file-copy-line
            context: common
            target: _self
            enabled: true
            order: 20
          - id: copy-selection
            label: 复制选中文本
            action: copySelection
            icon: ri:text
            context: text
            target: _self
            enabled: true
            order: 30
          - id: copy-image-url
            label: 复制图片地址
            action: copyImageUrl
            icon: ri:image-line
            context: image
            target: _self
            enabled: true
            order: 40
          - id: open-image
            label: 打开图片
            action: openImage
            icon: ri:external-link-line
            context: image
            target: _blank
            enabled: true
            order: 50
          - id: copy-link-url
            label: 复制链接地址
            action: copyLinkUrl
            icon: ri:links-line
            context: link
            target: _self
            enabled: true
            order: 60
          - id: open-link
            label: 打开链接
            action: openLink
            icon: ri:external-link-line
            context: link
            target: _blank
            enabled: true
            order: 70
          - id: scroll-top
            label: 返回顶部
            action: scrollTop
            icon: ri:arrow-up-line
            context: common
            target: _self
            enabled: true
            order: 80
          - id: reload
            label: 刷新页面
            action: reload
            icon: ri:refresh-line
            context: common
            target: _self
            enabled: true
            order: 90
          - id: home
            label: 返回首页
            action: home
            icon: ri:home-4-line
            context: common
            target: _self
            enabled: true
            order: 100
          - id: member-favorite
            label: 会员收藏
            action: memberFavorite
            icon: ri:star-line
            context: common
            target: _self
            enabled: true
            order: 110
          - id: member-sign-in
            label: 会员签到
            action: memberSignIn
            icon: ri:calendar-check-line
            context: common
            target: _self
            enabled: true
            order: 120
          - id: open-links-submit
            label: 申请友链
            action: openLinksSubmit
            icon: ri:links-fill
            context: common
            target: _self
            enabled: true
            order: 130
      formSchema:
        - $formkit: switch
          key: general_enabled
          name: enabled
          label: 启用全能右键
          value: true
        - $formkit: list
          key: general_includePaths
          name: includePaths
          label: 启用路径
          help: 留空表示全站启用；支持精确路径、/** 递归、/* 单层、/posts/{slug} 参数。
          itemType: string
          value: []
          addLabel: 添加路径
          children:
            - $formkit: text
              index: "$index"
              validation: required
        - $formkit: list
          key: general_excludePaths
          name: excludePaths
          label: 排除路径
          help: 排除规则优先级高于启用路径。
          itemType: string
          value:
            - /console/**
            - /uc/**
            - /apis/**
          addLabel: 添加排除路径
          children:
            - $formkit: text
              index: "$index"
              validation: required
        - $formkit: switch
          key: general_pjaxCompatible
          name: pjaxCompatible
          label: PJAX 兼容模式
          value: true
        - $formkit: switch
          key: general_showNativeOnEditable
          name: showNativeOnEditable
          label: 编辑区域保留系统右键
          value: true
        - $formkit: group
          key: general_style
          name: style
          label: 菜单样式
          value:
            theme: auto
            primaryColor: "#111827"
            menuWidth: 220
            borderRadius: 8
          children:
            - $formkit: select
              key: style_theme
              name: theme
              label: 主题
              value: auto
              options:
                - label: 跟随系统
                  value: auto
                - label: 浅色
                  value: light
                - label: 深色
                  value: dark
            - $formkit: color
              key: style_primaryColor
              name: primaryColor
              label: 强调色
              value: "#111827"
            - $formkit: number
              key: style_menuWidth
              name: menuWidth
              label: 菜单宽度
              value: 220
              min: 180
              max: 320
            - $formkit: number
              key: style_borderRadius
              name: borderRadius
              label: 圆角
              value: 8
              min: 0
              max: 16
        - $formkit: array
          key: general_menuItems
          name: menuItems
          label: 菜单项
          help: 会员收藏、会员签到依赖会员插件；申请友链依赖友链自助提交插件。
          value: []
          addLabel: 添加菜单项
          itemLabels:
            - type: iconify
              label: $value.icon
            - type: text
              label: $value.label
          children:
            - $formkit: switch
              key: menuItems_enabled
              name: enabled
              label: 启用
              value: true
            - $formkit: text
              key: menuItems_id
              name: id
              label: 标识
              help: 留空时会自动生成随机标识。
            - $formkit: text
              key: menuItems_label
              name: label
              label: 名称
              validation: required
            - $formkit: select
              key: menuItems_action
              name: action
              label: 动作
              validation: required
              options:
                - label: 复制当前页面链接
                  value: copyPageLink
                - label: 复制当前页面标题和链接
                  value: copyPageTitleLink
                - label: 复制选中文本
                  value: copySelection
                - label: 复制图片地址
                  value: copyImageUrl
                - label: 打开图片
                  value: openImage
                - label: 复制链接地址
                  value: copyLinkUrl
                - label: 打开链接
                  value: openLink
                - label: 返回顶部
                  value: scrollTop
                - label: 刷新页面
                  value: reload
                - label: 返回首页
                  value: home
                - label: 搜索
                  value: search
                - label: 自定义链接
                  value: customLink
                - label: 会员收藏（需会员插件）
                  value: memberFavorite
                - label: 会员签到（需会员插件）
                  value: memberSignIn
                - label: 申请友链（需友链自助提交插件）
                  value: openLinksSubmit
            - $el: div
              if: "$value.action === 'memberFavorite' || $value.action === 'memberSignIn'"
              attrs:
                class: "text-sm"
                style: |
                  display: inline-block;
                  margin-top: 0.5rem;
                  padding: 0.5rem 0.75rem;
                  background: #fffbeb;
                  border-radius: 0.375rem;
                  border: 1px solid #fcd34d;
              children:
                - $el: span
                  attrs:
                    style: "color: #92400e;"
                  children: "⚠️ 需要安装 "
                - $el: a
                  attrs:
                    href: "https://www.halo.run/store/apps/app-o4dfebmk"
                    target: "_blank"
                    style: |
                      color: #00a8ff;
                  children: "【会员插件】"
            - $el: div
              if: "$value.action === 'openLinksSubmit'"
              attrs:
                class: "text-sm"
                style: |
                  display: inline-block;
                  margin-top: 0.5rem;
                  padding: 0.5rem 0.75rem;
                  background: #fffbeb;
                  border-radius: 0.375rem;
                  border: 1px solid #fcd34d;
              children:
                - $el: span
                  attrs:
                    style: "color: #92400e;"
                  children: "⚠️ 需要安装 "
                - $el: a
                  attrs:
                    href: "https://www.halo.run/store/apps/app-nhczjfwn"
                    target: "_blank"
                    style: |
                      color: #00a8ff;
                  children: "【友链自助提交插件】"
            - $formkit: select
              key: menuItems_context
              name: context
              label: 显示场景
              value: common
              options:
                - label: 通用
                  value: common
                - label: 选中文本
                  value: text
                - label: 链接
                  value: link
                - label: 图片
                  value: image
            - $formkit: iconify
              key: menuItems_icon
              name: icon
              label: 图标
              value: ""
              format: name
              value-only: true
              help: 使用 Iconify 图标名称，例如 ri:link。
            - $formkit: text
              if: "$value.action === 'customLink'"
              key: menuItems_url
              name: url
              label: 自定义链接
              validation: required
            - $formkit: select
              if: "$value.action === 'openImage' || $value.action === 'openLink' || $value.action === 'customLink'"
              key: menuItems_target
              name: target
              label: 打开方式
              value: _self
              options:
                - label: 当前窗口
                  value: _self
                - label: 新窗口
                  value: _blank
            - $formkit: number
              key: menuItems_order
              name: order
              label: 排序
              value: 0
